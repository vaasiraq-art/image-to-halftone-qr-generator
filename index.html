<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>QR Fusion Studio — Two Halftone QR Generators</title>
<style>
  :root {
    --bg:#070b14;
    --panel:#0e1526;
    --panel-2:#121b30;
    --line:rgba(255,255,255,.09);
    --text:#f7f9fc;
    --muted:#95a3bb;
    --blue:#6b8cff;
    --violet:#9b78ff;
    --green:#57d8b1;
    --shadow:0 28px 90px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 0%, rgba(107,140,255,.16), transparent 30%),
      radial-gradient(circle at 88% 12%, rgba(155,120,255,.13), transparent 26%),
      radial-gradient(circle at 70% 100%, rgba(87,216,177,.08), transparent 30%),
      var(--bg);
  }
  .app{width:min(1500px,calc(100% - 28px));margin:0 auto;padding:24px 0 30px}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    margin-bottom:18px;padding:4px 4px 0;
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{
    width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;
    background:linear-gradient(135deg,var(--blue),var(--violet));
    box-shadow:0 12px 30px rgba(107,140,255,.28);
  }
  .logo svg{width:25px;height:25px}
  h1{font-size:clamp(20px,2.5vw,29px);margin:0;letter-spacing:-.035em}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .pill{
    border:1px solid var(--line);background:rgba(255,255,255,.035);color:#c7d0df;
    padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap
  }
  .shell{
    border:1px solid var(--line);border-radius:28px;background:rgba(14,21,38,.86);
    box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(18px)
  }
  .chooser{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.018)
  }
  .mode{
    position:relative;display:flex;align-items:center;gap:13px;text-align:left;
    border:1px solid transparent;border-radius:18px;padding:14px 16px;
    background:rgba(255,255,255,.028);color:var(--text);cursor:pointer;
    transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
  }
  .mode:hover{transform:translateY(-1px);background:rgba(255,255,255,.045)}
  .mode.active{
    border-color:rgba(107,140,255,.52);
    background:linear-gradient(135deg,rgba(107,140,255,.15),rgba(155,120,255,.08));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 10px 28px rgba(0,0,0,.14)
  }
  .mode-icon{
    width:43px;height:43px;border-radius:13px;display:grid;place-items:center;flex:none;
    background:#17223a;border:1px solid var(--line);color:#b7c5ff
  }
  .mode.active .mode-icon{background:linear-gradient(135deg,var(--blue),var(--violet));color:white;border-color:transparent}
  .mode-icon svg{width:22px;height:22px}
  .mode-copy{min-width:0}
  .mode-title{font-size:14px;font-weight:850;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#aab8ff;background:rgba(107,140,255,.11);border:1px solid rgba(107,140,255,.22);padding:3px 6px;border-radius:99px}
  .mode-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
  .workspace-head{
    min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 15px;border-bottom:1px solid var(--line);background:#0b1220
  }
  .current{display:flex;align-items:center;gap:8px;font-size:12px;color:#cbd5e5;font-weight:750}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(87,216,177,.09)}
  .actions{display:flex;gap:8px}
  .small-btn{
    border:1px solid var(--line);background:#121b2d;color:#dbe4f4;border-radius:10px;
    padding:7px 10px;font-size:11px;font-weight:750;cursor:pointer
  }
  .small-btn:hover{background:#18243b}
  .frame-wrap{
    position:relative;
    background:#eef1f6;
    min-height:320px;
    overflow:hidden;
  }
  iframe{
    display:block;
    width:100%;
    height:720px;
    border:0;
    background:transparent;
    overflow:hidden;
  }
  iframe[hidden]{display:none}
  .loading{
    position:absolute;inset:0;min-height:320px;display:grid;place-items:center;
    background:#0c1322;color:#aab6cb;z-index:2;font-size:13px;
    transition:opacity .2s ease
  }
  .loading.hide{opacity:0;pointer-events:none}
  .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{color:var(--muted);font-size:11px;text-align:center;margin-top:13px}

  @media (max-width:1024px){
    .app{width:min(100% - 20px,1500px);padding:14px 0 24px}
    .chooser{gap:10px;padding:10px}
    .mode{padding:12px 13px}
    .mode-desc{font-size:11px}
    .workspace-head{padding:9px 12px}
  }

  @media (max-width:680px){
    .app{width:100%;padding:0}
    .topbar{
      padding:14px 14px 12px;
      margin:0;
      background:rgba(7,11,20,.96);
      border-bottom:1px solid var(--line);
    }
    .logo{width:40px;height:40px;border-radius:12px}
    .logo svg{width:22px;height:22px}
    h1{font-size:20px}
    .brand p{font-size:11px;margin-top:2px}
    .pill{display:none}
    .shell{border-radius:0;border-left:0;border-right:0;box-shadow:none}
    .chooser{
      grid-template-columns:1fr 1fr;
      gap:8px;
      padding:10px;
      position:sticky;
      top:0;
      z-index:5;
      backdrop-filter:blur(16px);
    }
    .mode{
      min-width:0;
      padding:10px;
      gap:9px;
      border-radius:14px;
      align-items:center;
    }
    .mode-icon{width:36px;height:36px;border-radius:11px}
    .mode-icon svg{width:19px;height:19px}
    .mode-title{font-size:12px;line-height:1.2;display:block}
    .mode-desc,.tag{display:none}
    .workspace-head{min-height:42px;padding:8px 10px}
    .current{font-size:11px;min-width:0}
    .small-btn{padding:6px 8px;font-size:10px}
    .frame-wrap{min-height:260px}
    .loading{min-height:260px}
    .hint{padding:0 14px 14px;margin-top:10px}
  }

  @media (max-width:420px){
    .brand p{display:none}
    .chooser{gap:6px;padding:8px}
    .mode{padding:9px 8px}
    .mode-icon{width:32px;height:32px}
    .mode-title{font-size:11px}
    .workspace-head{padding:7px 9px}
    #reloadBtn{font-size:0;width:34px;height:30px;padding:0}
    #reloadBtn::after{content:"↻";font-size:18px;line-height:1}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/>
          <path d="M15 14h2v2h-2zM19 14h1v3h-3v3h-3v-2M19 19h1v1h-1z"/>
        </svg>
      </div>
      <div>
        <h1>QR Fusion Studio</h1>
        <p>Two image-to-QR styles in one clean workspace.</p>
      </div>
    </div>
    <div class="pill">Single HTML • 2 generators</div>
  </header>

  <section class="shell">
    <div class="chooser" role="tablist" aria-label="Choose QR generator">
      <button class="mode active" id="modeA" role="tab" aria-selected="true" aria-controls="frameA" data-target="frameA">
        <span class="mode-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM19 14h2v7h-7v-2"/></svg>
        </span>
        <span class="mode-copy">
          <span class="mode-title">Classic Halftone <span class="tag">More controls</span></span>
          <span class="mode-desc">Brightness, dot-size readability, QR version and halftone background controls.</span>
        </span>
      </button>

      <button class="mode" id="modeB" role="tab" aria-selected="false" aria-controls="frameB" data-target="frameB">
        <span class="mode-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="m4 15 4-4 4 4 3-3 5 5"/><circle cx="16.5" cy="8.5" r="1.5"/></svg>
        </span>
        <span class="mode-copy">
          <span class="mode-title">Enhanced Image QR <span class="tag">Clean export</span></span>
          <span class="mode-desc">Protected QR control areas, output scaling and quiet-zone PNG export.</span>
        </span>
      </button>
    </div>

    <div class="workspace-head">
      <div class="current"><span class="dot"></span><span id="currentLabel">Classic Halftone is active</span></div>
      <div class="actions">
        <button class="small-btn" id="reloadBtn" type="button">Reload current</button>
      </div>
    </div>

    <div class="frame-wrap">
      <div class="loading" id="loading"><div><div class="spinner"></div>Loading generator…</div></div>
      <iframe id="frameA" title="Classic Halftone QR Generator" referrerpolicy="no-referrer" scrolling="no"></iframe>
      <iframe id="frameB" title="Enhanced Image Halftone QR Generator" referrerpolicy="no-referrer" scrolling="no" hidden></iframe>
    </div>
  </section>
  <div class="hint">Choose either generator above. Each mode keeps its own controls and rendering engine.</div>
</div>

        .wrap{
          width:min(1180px,calc(100% - 32px))!important;
          margin:18px auto!important;
          grid-template-columns:minmax(300px,380px) minmax(0,1fr)!important;
          gap:18px!important;
        }
        .stage{min-height:0!important}
        .canvas-wrap{min-height:500px!important}
        @media(max-width:900px){
          .wrap{
            width:calc(100% - 24px)!important;
            margin:12px auto!important;
            grid-template-columns:1fr!important;
          }
          .stage{min-height:0!important}
          .canvas-wrap{min-height:390px!important}
        }
        @media(max-width:560px){
          .wrap{width:calc(100% - 12px)!important;margin:6px auto!important;gap:10px!important}
          .card{border-radius:16px!important}
          .panel,.stage{padding:15px!important}
          .row{grid-template-columns:1fr!important;gap:0!important}
          .row>div+div label{margin-top:12px!important}
          .btns{grid-template-columns:1fr!important}
          .canvas-wrap{min-height:300px!important;padding:10px!important;border-radius:14px!important}
          .stage-head{align-items:flex-start!important;flex-direction:column!important;gap:8px!important}
          textarea{min-height:82px!important}
        }
      </style>`
  };

  function decodeDataUrl(dataUrl){
    const raw = dataUrl.split(',')[1] || '';
    const binary = atob(raw);
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function makeResponsiveDocument(id){
    let doc = decodeDataUrl(sources[id]);
    const style = responsiveStyles[id] || '';
    return doc.includes('</head>') ? doc.replace('</head>', style + '</head>') : style + doc;
  }

  function resizeFrame(id){
    const frame = frames[id];
    if (!frame || frame.hidden || !frame.contentDocument) return;
    const doc = frame.contentDocument;
    const body = doc.body;
    const root = doc.documentElement;
    if (!body || !root) return;
    const h = Math.max(
      body.scrollHeight, body.offsetHeight,
      root.scrollHeight, root.offsetHeight
    );
    frame.style.height = Math.max(320, h + 2) + 'px';
  }

  function attachAutoResize(id){
    const frame = frames[id];
    const doc = frame.contentDocument;
    if (!doc || !doc.body) return;
    const old = resizeObservers.get(frame);
    if (old) old.disconnect();
    const ro = new ResizeObserver(() => resizeFrame(id));
    ro.observe(doc.body);
    ro.observe(doc.documentElement);
    resizeObservers.set(frame, ro);
    setTimeout(() => resizeFrame(id), 80);
    setTimeout(() => resizeFrame(id), 500);
    setTimeout(() => resizeFrame(id), 1400);
  }

  function loadFrame(id, force=false) {
    const frame = frames[id];
    if (force || !frame.dataset.loaded) {
      loading.classList.remove('hide');
      frame.onload = () => {
        loading.classList.add('hide');
        attachAutoResize(id);
      };
      frame.srcdoc = makeResponsiveDocument(id);
      frame.dataset.loaded = '1';
    } else {
      loading.classList.add('hide');
      resizeFrame(id);
    }
  }

  function selectMode(id) {
    active = id;
    for (const [key, frame] of Object.entries(frames)) frame.hidden = key !== id;
    buttons.forEach(btn => {
      const on = btn.dataset.target === id;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    currentLabel.textContent = labels[id];
    loadFrame(id);
    try { localStorage.setItem('qrFusionMode', id); } catch(e) {}
  }

  buttons.forEach(btn => btn.addEventListener('click', () => selectMode(btn.dataset.target)));

  document.getElementById('reloadBtn').addEventListener('click', () => {
    frames[active].dataset.loaded = '';
    loadFrame(active, true);
  });

  let initial = 'frameA';
  try {
    const saved = localStorage.getItem('qrFusionMode');
    if (saved === 'frameA' || saved === 'frameB') initial = saved;
  } catch(e) {}
  selectMode(initial);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => resizeFrame(active), 120);
  });
</script>
</body>
